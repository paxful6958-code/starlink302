<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Excel Sender</title>
    <!-- Include Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include SheetJS for reading Excel files in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 md:p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Telegram Excel Sender</h2>
        <p class="text-gray-600 mb-6">Upload an Excel file containing columns: <code class="bg-gray-100 px-1 py-0.5 rounded text-sm font-mono text-purple-600">BotToken</code>, <code class="bg-gray-100 px-1 py-0.5 rounded text-sm font-mono text-purple-600">ChatID</code>, and <code class="bg-gray-100 px-1 py-0.5 rounded text-sm font-mono text-purple-600">Message</code>.</p>

        <!-- File Upload Area -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Select Excel File (.xlsx, .xls)</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-lg p-2" />
        </div>

        <!-- Preview / Status Area -->
        <div id="statusArea" class="hidden mb-6 p-4 rounded-lg bg-blue-50 border border-blue-200 text-blue-800 text-sm">
            Loaded <span id="rowCount" class="font-bold">0</span> rows from Excel. Ready to send!
        </div>

        <!-- Send Button -->
        <button id="sendBtn" onclick="processAndSend()" disabled class="w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg shadow hover:bg-blue-700 transition disabled:bg-gray-300 disabled:cursor-not-allowed">
            Send Messages to Telegram
        </button>

        <!-- Logs / Results -->
        <div class="mt-8">
            <h3 class="text-lg font-semibold text-gray-800 mb-3">Live Log</h3>
            <div id="logBox" class="bg-gray-900 text-green-400 font-mono text-xs p-4 rounded-lg h-64 overflow-y-auto space-y-1">
                <span class="text-gray-500"># Waiting for file upload...</span>
            </div>
        </div>
    </div>

    <script>
        let excelData = [];

        // Listen for file upload
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // Read the first sheet
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Convert to JSON
                    excelData = XLSX.utils.sheet_to_json(worksheet);

                    if (excelData.length > 0) {
                        document.getElementById('rowCount').textContent = excelData.length;
                        document.getElementById('statusArea').classList.remove('hidden');
                        document.getElementById('sendBtn').removeAttribute('disabled');
                        logMessage(`[Info] Successfully loaded ${excelData.length} rows from Excel file.`);
                    } else {
                        alert("The Excel file appears to be empty.");
                    }
                } catch (error) {
                    alert("Error parsing Excel file: " + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Loop through data and send requests to Telegram API
        async function processAndSend() {
            if (excelData.length === 0) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.setAttribute('disabled', 'true');
            logMessage("[Info] Starting batch send process...");

            for (let i = 0; i < excelData.length; i++) {
                const row = excelData[i];
                const botToken = String(row.BotToken || '').trim();
                const chatId = String(row.ChatID || '').trim();
                const message = String(row.Message || '').trim();

                if (!botToken || !chatId || !message) {
                    logMessage(`[Warning] Row ${i + 1}: Missing BotToken, ChatID, or Message. Skipped.`);
                    continue;
                }

                const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
                const payload = {
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'Markdown'
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();

                    if (result.ok) {
                        logMessage(`[Success] Row ${i + 1}: Message sent to Chat ID ${chatId}`);
                    } else {
                        logMessage(`[Error] Row ${i + 1}: ${result.description}`);
                    }
                } catch (err) {
                    logMessage(`[Network Error] Row ${i + 1}: ${err.message}`);
                }

                // Add a small delay between requests to avoid Telegram rate limits
                await new Promise(resolve => setTimeout(resolve, 500));
            }

            logMessage("[Info] Batch process completed.");
            sendBtn.removeAttribute('disabled');
        }

        function logMessage(text) {
            const logBox = document.getElementById('logBox');
            const p = document.createElement('div');
            p.textContent = text;
            logBox.appendChild(p);
            logBox.scrollTop = logBox.scrollHeight;
        }
    </script>
</body>
</html>
